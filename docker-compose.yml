services:
  rabbitmq:
    image: rabbitmq:management
    container_name: pika-1582-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    # Healthchecks per https://www.rabbitmq.com/docs/monitoring#health-checks
    # check_port_connectivity is the recommended liveness probe; readiness
    # uses check_running + check_local_alarms.  Combined here for a single
    # readiness signal.
    healthcheck:
      test:
        - CMD-SHELL
        - rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 30s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  rabbitmq-data:
